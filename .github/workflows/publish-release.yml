name: Publish Release to Platforms

# Publishes an existing GitHub release's jars to CurseForge/Modrinth (no build). Normally started by
# tools/release.py, which dispatches this workflow after creating the release locally (GitHub may
# not fire the `release: published` event, so that trigger is only a fallback). Releases created by
# the build-mode workflow are skipped (author is github-actions[bot]); releases the local tool
# already published are skipped too (marker in the body).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish (leading "v" optional). Leave blank for the latest release.'
        required: false
      minecraft:
        description: 'Minecraft version (folder under versions/)'
        default: '1.21.1'

permissions:
  contents: write

jobs:
  # Resolves the tag so a manual run can be started with no input at all: the latest release is used
  # when the field is left blank, and the leading "v" is added if it was omitted.
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.author.login != 'github-actions[bot]' &&
       !contains(github.event.release.body, 'mod-template:published'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name || github.event.inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo '${{ github.repository }}' --limit 1 --json tagName --jq '.[0].tagName')
            if [ -z "$tag" ]; then
              echo "No release found to publish." >&2
              exit 1
            fi
            echo "No tag given; using the latest release: $tag"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "Publishing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    uses: ./.github/workflows/release-mod.yml
    with:
      mode: publish
      release_tag: ${{ needs.resolve.outputs.tag }}
      minecraft: ${{ github.event.inputs.minecraft || '1.21.1' }}
    secrets: inherit
