name: Release Mod (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: 'build = bump + build + GitHub release + publish; publish = download an existing GitHub release and publish it'
        required: false
        type: string
        default: 'build'
      mod:
        description: 'Component to re-version (build mode): the module id from versions.properties.'
        required: false
        type: string
        default: 'all'
      release_tag:
        description: 'Tag for this release (publish mode: required; build mode: blank to auto-compute v<module>.<stamp>)'
        required: false
        type: string
        default: ''
      minecraft:
        description: 'Minecraft version (folder under versions/)'
        required: false
        type: string
        default: '1.21.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # build mode: the triggering commit. publish mode: the released tag (so versions.properties
          # and the changelog match the jars we're about to publish).
          ref: ${{ inputs.mode == 'publish' && inputs.release_tag || github.sha }}
          # History + tags so the changelog can list recent commits and diff versions.properties.
          fetch-depth: 0

      # Read the selected Minecraft version's pins (bash only); the Java version feeds the CF
      # metadata and, in build mode, the setup-java step.
      - name: Resolve version pins
        run: |
          set -euo pipefail
          mc='${{ inputs.minecraft }}'
          props="versions/${mc}/version.properties"
          if [ ! -f "$props" ]; then
            echo "No such Minecraft version: $props" >&2
            exit 1
          fi
          java_ver=$(grep -E '^java_version=' "$props" | head -1 | cut -d= -f2 | tr -d '\r')
          {
            echo "MC_VERSION=$mc"
            echo "JAVA_VERSION=${java_ver:-21}"
          } >> "$GITHUB_ENV"
          echo "Minecraft ${mc} (Java ${java_ver:-21})"

      - uses: actions/setup-java@v5
        if: ${{ inputs.mode == 'build' }}
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Drop the committed local Windows JDK path and make the provider scripts executable.
      - name: Prepare
        run: |
          find . -name gradle.properties -not -path '*/build/*' -exec sed -i '/org.gradle.java.home/d' {} +
          chmod +x ./gradlew
          chmod +x .github/scripts/*.sh

      # Only the named component gets a new version (the trailing yymmddhh stamp is replaced; the
      # patch is manual). A single-mod project has exactly one component.
      - name: Bump component versions
        if: ${{ inputs.mode == 'build' }}
        env:
          MOD: ${{ inputs.mod }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, 'tools')
          import versioning

          mod = os.environ['MOD']
          stamp = versioning.stamp()
          path = versioning.ROOT / 'versions.properties'
          text = path.read_text(encoding='utf-8')

          # strip CR so a CRLF versions.properties cannot leak a trailing \r into the version
          # strings (mc-publish then looks for "dist/....26091603\r.jar" and finds nothing).
          current = {}
          for line in text.splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, _, v = line.partition('=')
                  current[k.strip()] = v.strip()

          ids = list(current)
          targets = ids if mod == 'all' else [mod]
          for comp in targets:
              if comp not in current:
                  sys.exit(f"unknown mod '{mod}' (known: {', '.join(ids)}, all)")

          for comp in ids:
              value = versioning.bump(current[comp], stamp) if comp in targets else current[comp]
              text = re.sub(rf'(?m)^{re.escape(comp)}=[^\r\n]*', f'{comp}={value}', text)

          path.write_text(text, encoding='utf-8', newline='\n')

          primary = ids[0]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for comp in ids:
                  value = versioning.bump(current[comp], stamp) if comp in targets else current[comp]
                  changed = 'true' if comp in targets else 'false'
                  env.write(f"{comp.upper()}_VERSION={value}\n")
                  env.write(f"{comp.upper()}_CHANGED={changed}\n")
              env.write(f"PRIMARY={primary}\n")
              env.write(f"PRIMARY_VERSION={versioning.bump(current[primary], stamp) if primary in targets else current[primary]}\n")
              env.write("MODULE_IDS=" + ",".join(ids) + "\n")
          print(text)
          PY

          # Release tag: v<<module major.minor.patch>>.<stamp> (an explicit input wins).
          tag='${{ inputs.release_tag }}'
          if [ -z "$tag" ]; then
            tag=$(python3 tools/versioning.py tag --api "${PRIMARY_VERSION}" --stamp "$(python3 tools/versioning.py stamp)")
          fi
          echo "Release tag: $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # Staged build so a failure names the layer that broke, then the union into build/release/.
      - name: Build loader jars
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" --refresh-dependencies releaseLoaderJars

      - name: Build loader bundles
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseLoaderBundles

      - name: Build universal jars
        if: ${{ inputs.mode == 'build' }}
        run: ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseUniversal

      - name: Build universal bundles + union
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pmc="${MC_VERSION}" releaseUniversalBundles releaseJars
          # Clear any pre-existing dist/ so a reused workspace cannot leak a stale jar.
          rm -rf dist
          mkdir -p dist
          cp build/release/*.jar dist/
          ls -la dist

      # publish mode: the jars come from the GitHub release the local (or a previous) run made.
      - name: Download release assets
        if: ${{ inputs.mode == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh release download '${{ inputs.release_tag }}' --dir dist --pattern '*.jar' --clobber
          ls -la dist
          # mc-publish defaults its `files` glob to build/libs/*.jar. A real build leaves jars
          # there; publish mode never builds, so stage the downloaded release jars there too.
          mkdir -p build/libs
          cp dist/*.jar build/libs/

      # Safety net: only the expected release jars may be published, and all of them must be there.
      # The count is computed from the project's own modules, never hardcoded. `allowed=` is the same
      # shape the build writes -- <id>-<version>-<loader>.jar, dashes allowed in the id so a `bundle-`
      # prefix matches -- so a stale jar from an earlier naming scheme fails here instead of shipping.
      - name: Verify release jar set
        run: |
          set -euo pipefail
          expected=$(python3 -c "
          import sys
          sys.path.insert(0, 'tools')
          import release
          print(release.expected_jars('${MC_VERSION}'))
          ")
          allowed='^[A-Za-z0-9_-]+-[0-9][0-9.]*-(fabric|neoforge|universal)\.jar$'
          bad=$(ls -1 dist | grep -vE "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected file(s) in dist/ (refusing to publish):" >&2
            echo "$bad" >&2
            exit 1
          fi
          count=$(ls -1 dist/*.jar | wc -l)
          if [ "$count" -ne "$expected" ]; then
            echo "Expected ${expected} release jars, found ${count}:" >&2
            ls -la dist >&2
            exit 1
          fi
          echo "Release jar set OK ($count files)"

      # publish mode: read the versions from the released commit and infer whether the component
      # changed by diffing versions.properties against the previous tag.
      - name: Resolve released versions + changed components
        if: ${{ inputs.mode == 'publish' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys
          sys.path.insert(0, 'tools')
          import versioning

          tag = os.environ['RELEASE_TAG']
          text = (versioning.ROOT / 'versions.properties').read_text(encoding='utf-8')
          versions = {}
          for line in text.splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, _, v = line.partition('=')
                  versions[k.strip()] = v.strip()

          def git(*args):
              return subprocess.run(['git', *args], capture_output=True, text=True).stdout

          prev = git('describe', '--tags', '--abbrev=0', f'{tag}^').strip()
          if not prev:
              print('No previous tag; treating the component as changed.')
              changed = set(versions)
          else:
              print(f'Diffing versions.properties: {prev}..{tag}')
              diff = git('diff', prev, tag, '--', 'versions.properties')
              print(diff)
              changed = {c for c in versions if re.search(rf'^[-+]{re.escape(c)}=', diff, re.M)}

          primary = next(iter(versions))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for comp, value in versions.items():
                  env.write(f"{comp.upper()}_VERSION={value}\n")
                  env.write(f"{comp.upper()}_CHANGED={'true' if comp in changed else 'false'}\n")
              env.write(f'PRIMARY={primary}\n')
              env.write(f'PRIMARY_VERSION={versions[primary]}\n')
              env.write('MODULE_IDS=' + ','.join(versions) + '\n')
              env.write(f'RELEASE_TAG={tag}\n')
          PY

      # The platform changelog: the last 3 commits, then a link to the full release notes.
      - name: Generate changelog
        run: |
          set -euo pipefail
          {
            git log -3 --no-merges --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "Full changelog: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } > dist/changelog.md
          cat dist/changelog.md

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'build' }}
        with:
          name: release-jars
          path: dist/*.jar

      # --- GitHub release: the per-loader jars and the universal jar --------------------------
      - name: Publish GitHub release
        if: ${{ inputs.mode == 'build' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.RELEASE_TAG }}
          github-generate-changelog: true
          files: dist/*.jar
          name: ${{ github.event.repository.name }} ${{ env.RELEASE_TAG }}
          version: ${{ env.RELEASE_TAG }}
          version-type: release

      # --- CurseForge: one entry per release, with the universal jar ---------------------------
      - name: CurseForge
        if: ${{ env.PRIMARY_CHANGED == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 
          curseforge-token: ${{ secrets.CURSEFORGE_API_KEY }}
          curseforge-files: dist/${PRIMARY}-${PRIMARY_VERSION}-universal.jar
          curseforge-dependencies: fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          name: ${{ env.PRIMARY }} ${{ env.PRIMARY_VERSION }}
          version: ${{ env.PRIMARY }}-${{ env.PRIMARY_VERSION }}
          changelog-file: dist/changelog.md
          version-type: release
          game-versions: ${{ env.MC_VERSION }}
          loaders: |
            fabric
            neoforge
          java: ${{ env.JAVA_VERSION }}
          retry-attempts: 5
          retry-delay: 15000
          fail-mode: warn

      # --- Modrinth (one project; the previous version is archived) ----------------------------
      - name: Modrinth
        if: ${{ vars.PUBLISH_MODRINTH == 'true' && env.PRIMARY_CHANGED == 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_GAME_VERSIONS: ${{ env.MC_VERSION }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || '' }}
        run: |
          set -euo pipefail
          ./.github/scripts/modrinth-sync.sh \
            "${MODRINTH_ID}" \
            "mr.${PRIMARY}.version.${MC_VERSION}" "${PRIMARY_VERSION}" "${PRIMARY} ${PRIMARY_VERSION}" \
            "dist/${PRIMARY}-${PRIMARY_VERSION}-universal.jar"

      # --- Persist the bumped version / learned Modrinth id back to main -----------------------
      - name: Commit version + release state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- versions.properties release-state.properties; then
            echo "No version/state changes to commit."
            exit 0
          fi

          git stash push -- versions.properties release-state.properties
          git fetch origin main
          git checkout -B main origin/main
          git stash pop
          git add versions.properties release-state.properties
          git commit -m "Release ${{ env.RELEASE_TAG }}: update release state"
          git push origin main
