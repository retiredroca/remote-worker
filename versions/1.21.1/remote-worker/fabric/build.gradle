plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def repoRoot = projectDir
while (repoRoot != null && !new File(repoRoot, 'gradle/versions.gradle').exists()) {
    repoRoot = repoRoot.parentFile
}
apply from: new File(repoRoot, 'gradle/versions.gradle')
apply from: new File(repoRoot, 'gradle/mirror-sources.gradle')

version = mod_version
group = mod_group_id

base {
    // The jar is named <mod-id>-<version>-fabric.jar (see jarFileName in gradle/versions.gradle), so
    // archivesName is the bare mod id and the loader is the trailing element of the file name.
    archivesName = mod_id
}
// Name the file, do NOT use archiveClassifier. A classifier is part of the published maven
// identity, so it lands in repo/ as <artifactId>-<version>-fabric.jar and every host module
// fails to resolve the library - the classes are inside the jar, Loom looks for the
// unclassified name. archiveFileName renames the file and leaves the classifier empty, so
// the coordinate is untouched. Verified: remapJar does write to this name, and what lands
// there is the remapped jar (the jar task's output goes to build/devlibs).
tasks.named('jar') { archiveFileName = jarFileName(mod_id, mod_version, 'fabric') }
// remapJar is the task that writes the final artifact, and it does not inherit
// archiveFileName from jar, so it has to be named explicitly.
tasks.named('remapJar') { archiveFileName = jarFileName(mod_id, mod_version, 'fabric') }

// The shared sources are compiled once per loader. To let a single merged jar hold both the Fabric
// (intermediary) and NeoForge (Mojang) variants, each loader gets its own copy of the common classes
// under a loader-specific sub-package (e.g. <group>.fabric.common.*), so the two mapping variants do
// not collide by class name.
def commonPrefix = mod_group_id
def relocatedPrefix = "${mod_group_id}.fabric.common"

// Sync, not Copy: a Copy adds and never removes, so a *renamed or deleted* source leaves its
// generated copy behind. compileJava then compiles it, and the stale .class ends up in the jar
// alongside the current one -- from a green build, with every test passing. Sync makes the
// destination match the source exactly. Each of these writes to a distinct directory
// (generated/common, generated/loader, generated/common-test), so they cannot delete each other's
// output.
tasks.register('relocateCommonSources', Sync) {
    from(rootProject.file('../common/src/main/java'))
    into(layout.buildDirectory.dir('generated/common'))
    filter { String line ->
        line.replace(commonPrefix, relocatedPrefix)
    }
}

// Sync, not Copy: a Copy adds and never removes, so a *renamed or deleted* source leaves its
// generated copy behind. compileJava then compiles it, and the stale .class ends up in the jar
// alongside the current one -- from a green build, with every test passing. Sync makes the
// destination match the source exactly. Each of these writes to a distinct directory
// (generated/common, generated/loader, generated/common-test), so they cannot delete each other's
// output.
tasks.register('relocateLoaderSources', Sync) {
    from('src/main/java')
    into(layout.buildDirectory.dir('generated/loader'))
    filter { String line ->
        def matcher = line =~ /import ${java.util.regex.Pattern.quote(commonPrefix)}\.(?!fabric\b|neoforge\b|mixin\b)([A-Za-z0-9_.]+);/
        if (matcher.find()) {
            return "import ${relocatedPrefix}.${matcher.group(1)};"
        }
        return line
    }
}

// The wire-format conformance check lives in common/src/test/java and is relocated for the same
// reason main is: the two loader builds compile it against differently named classes
// (<group>.fabric.common.* versus <group>.neoforge.common.*).
// Sync, not Copy: a Copy adds and never removes, so a *renamed or deleted* source leaves its
// generated copy behind. compileJava then compiles it, and the stale .class ends up in the jar
// alongside the current one -- from a green build, with every test passing. Sync makes the
// destination match the source exactly. Each of these writes to a distinct directory
// (generated/common, generated/loader, generated/common-test), so they cannot delete each other's
// output.
tasks.register('relocateCommonTestSources', Sync) {
    from(rootProject.file('../common/src/test/java'))
    into(layout.buildDirectory.dir('generated/common-test'))
    filter { String line ->
        line.replace(commonPrefix, relocatedPrefix)
    }
}

sourceSets {
    main {
        java {
            srcDirs = []
            srcDir(tasks.named('relocateCommonSources'))
            srcDir(tasks.named('relocateLoaderSources'))
        }
        resources {
            // Shared assets/data live once in ../common; only loader metadata stays per-loader.
            srcDir(rootProject.file('../common/src/main/resources'))
        }
    }
    test {
        java {
            srcDirs = []
            srcDir(tasks.named('relocateCommonTestSources'))
        }
    }
}

// --- wire-format conformance -----------------------------------------------------------------------
// tools/protocol_vectors.py is the normative encoder for the protocol. It generates the byte
// vectors, and this round-trips every one of them through the shared codec, so a field width that
// differs between the three implementations fails the build instead of becoming subtly wrong bytes
// on the wire. The format is written down once, in the generator.
def protocolVectorsFile = layout.buildDirectory.file('protocol/vectors.txt')
def protocolVectorsTask = tasks.register('protocolVectors', Exec) {
    inputs.file new File(repoRoot, 'tools/protocol_vectors.py')
    outputs.file protocolVectorsFile
    commandLine 'python3', new File(repoRoot, 'tools/protocol_vectors.py').absolutePath, protocolVectorsFile.get().asFile.absolutePath
}

tasks.register('protocolCheck', JavaExec) {
    dependsOn protocolVectorsTask
    classpath = sourceSets.test.runtimeClasspath
    // The relocated name, not the source one: the test sources are relocated into
    // <group>.<loader>.common.protocol exactly like main, so the class on disk is not the
    // class in the source tree.
    mainClass = relocatedPrefix + '.protocol.ProtocolVectorsCheck'
    args protocolVectorsFile.get().asFile.absolutePath
}

tasks.named('check') { dependsOn tasks.named('protocolCheck') }

loom {
    // Official Mojang mappings so the source matches the NeoForge build 1:1.
    officialMojangMappings()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    inputs.property "java_version", java_version
    inputs.property "mod_id", mod_id

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "java_version": java_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_license": mod_license,
                "mod_authors": mod_authors
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
    withSourcesJar()
}

// Keep build/libs to this build's jars only: drop any kept from earlier version stamps. Without
// this the directory accumulates every version ever built, and a version-pinned root lookup that
// still pointed at an old name would resolve a stale jar while the build reports success.
// .toString() on the sources entry is required: a GString never equals the String that File.name
// returns, so a keep-set built from a closure would match nothing and delete the jar just built.
tasks.named('build') {
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        if (!libs.isDirectory()) {
            return
        }
        def name = base.archivesName.get()
        def keep = [jarFileName(mod_id, mod_version, 'fabric').toString(),
                    "${name}-${project.version}-sources.jar".toString()] as Set
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}
