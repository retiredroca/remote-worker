plugins {
    id 'base'
}

apply from: new File(projectDir, 'gradle/versions.gradle')

def mc = providers.gradleProperty('mc').getOrElse('1.21.1')
def versionRoot = "versions/${mc}"

// Discover modules under versions/<mc>/ (any directory with fabric/ + neoforge/ sources).
def moduleDirs = (file(versionRoot).listFiles() ?: new File[0])
        .findAll { it.isDirectory() && new File(it, 'fabric').exists() && new File(it, 'neoforge').exists() }
        .sort { it.name }

def loadModule = { File moduleDir ->
    def p = new Properties()
    new File(moduleDir, 'module.properties').withInputStream { p.load(it) }
    return p
}

// Exact, version-pinned jar lookups so a stale jar from an earlier build can never be picked.
def versionedJar = { String path ->
    def f = file(path)
    f.exists() ? f : null
}

def dependOnBuilds = { org.gradle.api.Task t, String id ->
    t.dependsOn gradle.includedBuild("${id}-fabric").task(':build')
    t.dependsOn gradle.includedBuild("${id}-neoforge").task(':build')
}

def universalTasks = []

moduleDirs.each { moduleDir ->
    def props = loadModule(moduleDir)
    def id = props.getProperty('id')
    def groupPath = props.getProperty('group').replace('.', '/')
    def modVersion = stampVersion(componentVersions.getProperty(id))
    def fabricJar = { versionedJar("${versionRoot}/${moduleDir.name}/fabric/build/libs/${jarFileName(id, modVersion, 'fabric')}") }
    def neoforgeJar = { versionedJar("${versionRoot}/${moduleDir.name}/neoforge/build/libs/${jarFileName(id, modVersion, 'neoforge')}") }

    def t = tasks.register("universalJar_${id.replaceAll('[^A-Za-z0-9]', '_')}", Jar) {
        dependOnBuilds(delegate, id)
        archiveFileName = jarFileName(id, modVersion, 'universal')
        destinationDirectory = layout.buildDirectory.dir('libs')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        // Fabric half: fabric classes + relocated common + fabric.mod.json.
        from({ def f = fabricJar(); f == null ? [] : zipTree(f) })
        // NeoForge-only classes + metadata. The relocated common lives under <group>.neoforge.common,
        // so the neoforge/** include below pulls it in.
        from({ def f = neoforgeJar(); f == null ? [] : zipTree(f) }) {
            include "${groupPath}/neoforge/**"
            include 'META-INF/neoforge.mods.toml'
            include 'META-INF/accesstransformer.cfg'
        }
    }
    universalTasks << t
}

// --- staged release groups, then the union ------------------------------------------------------
// A single-mod project has no bundles, so only the universal groups apply:
//   1 releaseUniversal        build/release-universal/        (merged universal jars)
//   2 releaseUniversalBundles build/release-universal-bundles/ (none here; no bundles.properties)
// releaseLoaderJars / releaseLoaderBundles build the per-loader jars for one loader only
// (-Ploader=fabric|neoforge). releaseJars is the ordered union of all four into build/release/.
def loaderFilter = (findProperty('loader') ?: '').toString().toLowerCase()
def activeLoaders = loaderFilter ? [loaderFilter] : ['fabric', 'neoforge']

def loaderJarSources = { org.gradle.api.tasks.Sync t ->
    moduleDirs.each { moduleDir ->
        def id = loadModule(moduleDir).getProperty('id')
        def modVersion = stampVersion(componentVersions.getProperty(id))
        activeLoaders.each { loader ->
            t.dependsOn gradle.includedBuild("${id}-${loader}").task(':build')
            t.from({ versionedJar("${versionRoot}/${moduleDir.name}/${loader}/build/libs/${jarFileName(id, modVersion, loader)}") }) {
                rename { jarFileName(id, modVersion, loader) }
            }
        }
    }
}

tasks.register('releaseLoaderJars', Sync) {
    into layout.buildDirectory.dir('release-loader')
    loaderJarSources(delegate)
}

tasks.register('releaseLoaderBundles', Sync) {
    into layout.buildDirectory.dir('release-loader-bundles')
    // No bundles in a single-mod project; the group stays for a uniform release contract.
}

tasks.register('releaseUniversal', Sync) {
    into layout.buildDirectory.dir('release-universal')
    universalTasks.each { task ->
        dependsOn task
        from(task)
    }
}

tasks.register('releaseUniversalBundles', Sync) {
    into layout.buildDirectory.dir('release-universal-bundles')
    // No bundles in a single-mod project.
}

// The union of the four staged directories, as one task.
//
// This was four hand-rolled copy tasks, and it was wrong in two ways that both showed up as a
// stale build/release/ rather than as an error:
//   - each one declared its OUTPUT directory but never its input, so `dependsOn` ordered the work
//     without saying what the task read. Once build/release/ existed, Gradle found the output
//     snapshot unchanged and skipped the copy permanently: a new version stamp landed in
//     build/release-loader/ while build/release/ went on serving the previous stamp.
//   - nothing removed what was no longer produced, so each earlier stamp accumulated there as well.
// A Sync over all four directories fixes both: the inputs are declared, and the destination is
// emptied of anything this task did not put there. Sync also cannot be four tasks sharing one
// output directory, which is why this is one task rather than four Syncs.
def releaseGroups = ['releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal',
                     'releaseUniversalBundles']

tasks.register('releaseJars', Sync) {
    releaseGroups.each { name ->
        def group = tasks.named(name)
        dependsOn group
        from(group.map { it.destinationDir })
    }
    into layout.buildDirectory.dir('release')
}

tasks.register('cleanLoader') {
    delete layout.buildDirectory.dir('release-loader')
    delete layout.buildDirectory.dir('release-loader-bundles')
}

tasks.register('cleanUniversal') {
    delete layout.buildDirectory.dir('release-universal')
    delete layout.buildDirectory.dir('release-universal-bundles')
}

// No library modules in the single template, but keep the task for a uniform release contract.
tasks.register('publishLibrary') {
    group = 'publishing'
    description = 'Publishes library modules (library=true) to the in-repo maven (repo/).'
    moduleDirs.each { moduleDir ->
        def props = loadModule(moduleDir)
        if ((props.getProperty('library') ?: 'false').toBoolean()) {
            def id = props.getProperty('id')
            dependsOn gradle.includedBuild("${id}-fabric").task(':publishMavenJavaPublicationToRepoRepository')
            dependsOn gradle.includedBuild("${id}-neoforge").task(':publishMavenJavaPublicationToRepoRepository')
        }
    }
}

// The C++ endpoint agent, built by CMake rather than Gradle.
//
// Two build systems now, so this is where the hand-off happens and where the release artifact is
// NAMED. Naming lives here rather than in CMake deliberately: the name has to carry the version
// stamp, which only Gradle knows, and it is the allowlist in tools/release.py and the platform list
// in .github/workflows/release-ci.yml that both sides must agree with. One owner for the name.
def cppBuildDir = layout.buildDirectory.dir('cpp')
def cppStaged = cppBuildDir.map { it.dir('staged') }
def cppSource = file('CMakeLists.txt')

// -PskipCpp=true turns every C++ task into a no-op. The CI release runs the pure-Java jar build on
// ubuntu and the native agent in a separate platform matrix (see release-ci.yml); without this the
// jar job would also invoke cmake on ubuntu, duplicating the linux agent build and, worse, making
// the jar job depend on a C++ toolchain and a POSIX socket path it does not otherwise need. The
// matrix is the single place the agent is built; the jar job stays Java-only.
def skipCpp = (project.findProperty('skipCpp') ?: 'false').toString().toBoolean()

// The version the binaries ship as: the stamped version of the module that owns the release, so the
// binary and the jars in one release always carry the same number. A single-module project has one
// answer; a multi-module project needs this pointed at whichever module owns the release.
def cppVersion = stampVersion(componentVersions.getProperty(loadModule(moduleDirs[0]).getProperty('id')))

// Host platform, in the vocabulary the release artifact uses. Never a bare "linux"/"windows": a
// download page has to be able to tell a Windows user which file to take, and an unlabelled binary
// is worse than none.
def hostPlatform = {
    String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    String osPart = os.contains('windows') ? 'windows' : (os.contains('mac') || os.contains('darwin') ? 'macos' : 'linux')
    String archPart = (arch in ['amd64', 'x86_64']) ? 'x86_64' : (arch in ['aarch64', 'arm64'] ? 'arm64' : arch)
    return "${osPart}-${archPart}"
}()

def cmakeConfigure = tasks.register('cmakeConfigure', Exec) {
    description = 'Configures the CMake build for the agent.'
    inputs.file cppSource
    inputs.dir file('agent')
    outputs.dir cppBuildDir
    commandLine 'cmake', '-S', projectDir.absolutePath, '-B', cppBuildDir.get().asFile.absolutePath,
            '-DCMAKE_BUILD_TYPE=Release'
    // Re-running configure on every build is slow and, with some generators, prompts. Skip it when
    // the build directory is already there and the inputs have not moved.
    onlyIf {
        !skipCpp && !cppBuildDir.get().asFile.isDirectory()
    }
}

def cppBuild = tasks.register('cppBuild', Exec) {
    description = 'Builds the C++ endpoint agent.'
    dependsOn cmakeConfigure
    inputs.dir file('agent')
    outputs.dir cppStaged
    commandLine 'cmake', '--build', cppBuildDir.get().asFile.absolutePath, '--config', 'Release'
    onlyIf { !skipCpp }
}

// Copies the built binary into build/release/ under its release name, so everything the release
// publishes lives in one directory. Only the host platform is built here: cross-compiling all three
// needs a runner per platform, which is a CI matrix, not a Gradle task.
// The single file CMake stages, by platform. Named rather than globbed: see stageCppBinaries.
def cppBinaryName = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'remote-worker.exe'
        : 'remote-worker'

// The release name a staged binary gets, so doFirst can recognise the current one and spare it.
def renameName = { String name ->
    String ext = name.endsWith('.exe') ? '.exe' : ''
    String stem = name.substring(0, name.length() - ext.length())
    "${stem}-${cppVersion}-${hostPlatform}${ext}"
}

def stageCppBinaries = tasks.register('stageCppBinaries', Copy) {
    description = 'Stages the built C++ binaries into build/release with their release names.'
    dependsOn cppBuild
    from(cppStaged)
    into layout.buildDirectory.dir('release')
    // Exactly the one expected file, not a glob. CMake's staged directory is not cleaned between
    // builds, so after the target was renamed from remote-worker-relay to remote-worker both files
    // sat there and a glob copied the retired binary into the release as though it were current.
    // Naming the file means a stale artifact cannot be published, and a missing one is a build
    // failure rather than a silent omission.
    include cppBinaryName
    onlyIf { !skipCpp }
    // Clear any other staged binary of ours first. releaseJars is a Sync and would do this, but
    // Gradle skips an up-to-date Sync, so a file left by an earlier build (or an earlier name for
    // this one) can survive a green build and be published. Copy adds and never removes, so the
    // removal has to be explicit here.
    doFirst {
        def dir = layout.buildDirectory.dir('release').get().asFile
        if (dir.isDirectory()) {
            // Not a jar, and not the binary this build produced. The jar test is not redundant:
            // the mod's id is 'remote-worker' too, so a plain prefix test matches the mod's own
            // jars and deletes them.
            def keep = renameName(cppBinaryName)
            dir.listFiles()?.findAll {
                it.isFile() && !it.name.endsWith('.jar') && it.name.startsWith('remote-worker') &&
                        it.name != keep
            }?.each { it.delete() }
        }
    }
    rename renameName
}

// The binary is staged *after* releaseJars, not before. releaseJars is a Sync task, which means it
// makes build/release match its inputs exactly -- so it deletes anything in that directory that is
// not a jar. Staging the binary first therefore had it deleted again a moment later, and the release
// quietly shipped no binary at all. Nothing failed: the build was green, the jar count was right, and
// the omission only showed up by listing build/release.
tasks.named('releaseJars') { finalizedBy stageCppBinaries }

// Catches the one class of error a Windows build cannot see: a POSIX-only symbol used in a file
// whose `#else` branch does not include the header declaring it. That has broken the Linux CI legs
// twice, in two different files, and each time only CI found it. It is a text check rather than a
// compile, because the failure mode is a missing #include that no single-platform build can see.
tasks.register('checkPosixIncludes') {
    description = 'Checks that POSIX-only C++ symbols have the headers that declare them.'
    group = 'verification'
    def script = new File(rootProject.projectDir, 'tools/check_posix_includes.py')
    def cppSources = fileTree(new File(rootProject.projectDir, 'agent/src')) { include '**/*.cpp' }
    inputs.file script
    inputs.files cppSources
    outputs.upToDateWhen { false }
    doLast {
        def result = exec {
            commandLine 'python', script.absolutePath
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException('tools/check_posix_includes.py failed -- see above')
        }
    }
}

tasks.named('check') { dependsOn 'checkPosixIncludes' }

tasks.named('build') {
    dependsOn 'releaseJars'

    // Sweep stale universal jars of earlier versions so build/libs only ever holds this build's.
    // The per-loader builds sweep their own build/libs; this is the root's copy of the same guard.
    doLast {
        def keep = moduleDirs.collect {
            def mid = loadModule(it).getProperty('id')
            jarFileName(mid, stampVersion(componentVersions.getProperty(mid)), 'universal').toString()
        } as Set
        def libs = layout.buildDirectory.dir('libs').get().asFile
        libs.listFiles()?.each { f ->
            if (f.isFile() && f.name.endsWith('.jar') && !keep.contains(f.name)) {
                f.delete()
            }
        }
    }
}

// Cleaning at the root cleans every included build too.
tasks.named('clean') {
    moduleDirs.each { moduleDir ->
        def id = loadModule(moduleDir).getProperty('id')
        dependsOn gradle.includedBuild("${id}-fabric").task(':clean')
        dependsOn gradle.includedBuild("${id}-neoforge").task(':clean')
    }
}

apply from: new File(projectDir, 'gradle/version-resolver.gradle')

// Refuse to build a release set on a feature branch that never took its own version line: its jars
// would be named exactly like the released ones. Attached to the release tasks only, so ordinary
// development (`./gradlew build`) is unaffected. The check reads git at execution time, so it works
// the same in a worktree as in a plain checkout, and it is skipped on a detached HEAD (a CI
// checkout, which is the release line by definition).
['releaseLoaderJars', 'releaseLoaderBundles', 'releaseUniversal',
 'releaseUniversalBundles', 'releaseJars'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        featureLineGuard(taskName)
    }
}
